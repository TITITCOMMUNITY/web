<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — BILSX</title>
  <link rel="stylesheet" href="/style.css?v=2">
</head>

<body data-page="login">
  <div class="page">
    <div class="title">
      <h1>Welcome back</h1>
      <p class="muted">Login to your BILSX account.</p>
    </div>

    <form id="loginForm" class="form" autocomplete="on">
      <div id="msg" class="msg"></div>

      <div class="field">
        <label for="login">Username or Email</label>
        <input id="login" name="login" type="text"
               autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit">Login</button>

      <p class="muted" style="text-align:center;margin-top:15px">
        No account? <a href="/register.html">Register</a>
      </p>
    </form>
  </div>

  <script src="/app.js?v=2" defer></script>
</body>
</html>
