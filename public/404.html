<title>404 • BILSX</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#261044 0,#0b0712 52%,#050409 100%);font-family:Inter,system-ui,-apple-system,sans-serif;color:#f7f4ff}.wrap{width:min(680px,calc(100% - 32px));text-align:center;padding:48px 28px;border:1px solid rgba(168,82,255,.22);border-radius:28px;background:rgba(16,11,24,.82);box-shadow:0 25px 80px rgba(0,0,0,.45)}.logo{font-weight:900;font-size:20px;letter-spacing:.16em;color:#b36cff}.code{font-size:clamp(88px,22vw,160px);line-height:.85;font-weight:950;letter-spacing:-.08em;margin:30px 0 18px;background:linear-gradient(135deg,#fff,#9f4cff);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:#a89fb7}.message{color:#a9a1b4;line-height:1.7;margin:0 auto 28px;max-width:520px}.path{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 12px;border-radius:10px;background:#09070d;color:#c9bdd7;font:12px ui-monospace,SFMono-Regular,monospace}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}a{display:inline-block;text-decoration:none;color:#fff;padding:12px 18px;border-radius:12px;border:1px solid rgba(168,82,255,.35)}a.primary{background:#9144f2;border-color:#a45cff}small{display:block;margin-top:24px;color:#665d70;font-size:11px}
