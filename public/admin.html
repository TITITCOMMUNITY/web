<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BILSX Admin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-nav{max-width:1180px;margin:0 auto;padding:0 20px 25px;display:flex;gap:10px;flex-wrap:wrap}
    .admin-nav a{padding:10px 14px;border:1px solid #ffffff14;border-radius:9px;background:#0e0c19}
    .admin-nav a.primary{background:#8e3df2;border-color:#a65aff}
  </style>
</head>
<body data-page="admin">
  <main>
    <header style="max-width:1180px;margin:auto;padding:35px 20px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px">
      <div>
        <span class="eyebrow">BILSX CONTROL CENTER</span>
        <h1 style="margin:4px 0">Admin Dashboard</h1>
      </div>
      <button id="logoutBtn">Logout</button>
    </header>

    <nav class="admin-nav">
      <a class="primary" href="/admin-users.html">User Management</a>
      <a href="/admin-keys.html">Keys</a>
      <a href="/admin-logs.html">Logs</a>
    </nav>

    <section class="grid">
      <div class="card">Users <b id="totalUsers">0</b></div>
      <div class="card">Active <b id="activeUsers">0</b></div>
      <div class="card">Premium <b id="premiumUsers">0</b></div>
      <div class="card">Keys <b id="licenseKeys">0</b></div>
      <div class="card">Active Keys <b id="activeKeys">0</b></div>
    </section>

    <section class="card">
      <h2>Recent Users</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Plan</th><th>Status</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
